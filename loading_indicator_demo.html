<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Indicator Demo</title>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-tertiary: #2C2C2E;
            --text-secondary: #8E8E93;
        }

        body {
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .demo-container {
            max-width: 390px;
            padding: 2rem;
        }

        .message {
            background: var(--bg-tertiary);
            padding: 0.875rem 1.25rem;
            border-radius: 18px;
            margin-bottom: 0.75rem;
            max-width: 75%;
            word-wrap: break-word;
            color: white;
        }

        .message.assistant {
            background: var(--bg-tertiary);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .loading-message {
            padding: 1rem 1.25rem;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 20px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            opacity: 0.4;
            animation: typing-dot 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing-dot {
            0%, 60%, 100% {
                opacity: 0.4;
                transform: scale(1);
            }
            30% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        h1 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>Loading Indicator Demo</h1>
        <p class="label">This is what users see while waiting for responses:</p>
        <div class="message assistant loading-message">
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <p class="label">The dots pulse in sequence with smooth animations</p>
    </div>
</body>
</html>
